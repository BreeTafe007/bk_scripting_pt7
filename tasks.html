<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks | Gelos Enterprises</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>

        <nav>
            <div class="logo">
                <a href="index.html"><img id="header-logo" src="images/GE_Logo-inline-on-white.png"
                        alt="Gelos Enterprises logo"></a>
            </div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a class="active" href="tasks.html">Tasks</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <div class="header-lines">
            <!-- <div class="line line-one"></div> -->
            <div class="line line-one"></div>
            <div class="line line-two"></div>
        </div>
    </header>



    <main class="tasks-main">








        <h2>Create New Task</h2>

        <form action="">

            <label for="fname">Task Name:</label>
            <input type="text" id="taskName" name="taskName" placeholder="Please type Task Name here"><br>

            <br><br>

            <label for="due-date">Due Date:</label>
            <input type="date" id="due-date" name="due-date">
            <input type="submit">

            <br><br><br>


            <label for="priority">Select priority level:</label>
            <select id="priority" name="priority">
                <option value="volvo">High</option>
                <option value="saab">Medium</option>
                <option value="fiat">Low</option>
            </select>
            <input type="submit">

            <br><br>
            <input type="submit" value="Create Task">

        </form>



        <!-- User Input Table -->
        <div class="activity">
            <h3>Add New Product</h3>
            <p>Please enter task name, due date, priorty level, and consultant assigned (optional) in the provided
                fields.</p>
            <div class="addProductForm">
                <!-- Task Name -->
                <input id="inputTaskName" type="text" placeholder="Task name">
                <!-- Task Due Date -->
                <input id="inputDueDate" type="date">
                <!-- Task Priority Level -->
                <select id="inputPriority" name="priority">
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
                <!-- Task Consultant -->
                <select id="inputConstultant" name="constultant">
                    <option value="consultant 1">Consultant 1</option>
                    <option value="consultant 2">Consultant 2</option>
                    <option value="consultant 3">Consultant 3</option>
                </select>
                <!-- Create Task Button -->
                <button class="btn-add" id="btnAddTask">Create Task</button>
            </div>
        </div>




        <!-- Task List Table -->
        <h3>Task List</h3>
        <table>
            <thead>
                <tr>
                    <th>Task Name</th>
                    <th>Due Date</th>
                    <th>Priority Level</th>
                    <th>Consultant</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="taskListTableBody">

            </tbody>

            <tfoot>
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            </tfoot>
        </table>
















</body>

</html>





</main>



<footer>
    <div class="footer-lines">
        <div class="line line-two"></div>
        <div class="line line-one"></div>
    </div>
    <div class="external-links">
        <a class="external-link" href="#">Privacy Policy</a>
        <a class="external-link" href="#">Internet Usage Policy</a>
    </div>
</footer>




<script src="js/script.js"></script>

</body>

</html>
