<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Gelos Enterprises Task Manager</title>
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <!-- Header -->
  <header class="nav-wrapper">

    <nav class="navbar">

      <!-- Company Logo -->
      <div class="logo">
        <a href="index.html"><img id="header-logo" src="images/GE_Logo.png" alt="Gelos Enterprises logo"></a>
      </div>

      <!-- Webpage Title -->
      <div class="header-title">
        <h1><b>Task Manager</b></h1>
      </div>

      <!-- Hamburger Menu -->
      <input type="checkbox" id="menu-toggle" class="menu-toggle">
      <label for="menu-toggle" class="hamburger">
        <span></span><span></span><span></span>
      </label>


      <!-- Navigation Links -->
      <ul class="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="tasks.html">Tasks</a></li>
        <li><a class="active" href="contact.html">Contact</a></li>
      </ul>

    </nav>





    <!-- Header Lines -->
    <div class="header-lines">
      <div class="line line-one"></div>
      <div class="line line-two"></div>
    </div>

  </header>

  <!-- Main Section of Contact Page -->
  <main class="contact-main">

    <!-- Contact Page Image (and Toggle Message) -->
    <div class="contact-img-container">
      <img id="contact-img" src="images/AdobeStock_443550502.jpeg"
        alt="Group of people having a meeting at an office table">

      <div id="contactMessage" class="card"></div>
    </div>

    <!-- Contact form adapted from Web3Forms Basic HTML Contact Form template: https://web3forms.com/templates/basic-html-contact-form -->
    <section class="card">
      <div class="contact-intro">
        <h2 class="contact-title">Contact Us</h2>
        <p class="contact-description">
          Fill out the form below and we will get back to you as soon as possible.
        </p>
      </div>

      <form class="contact-form" action="" method="POST" autocomplete="off">
        <div class="form-group-container">
          <!-- User Input: Name (required) -->
          <div class="form-group">
            <label for="name" class="form-label">Name</label>
            <input id="name" name="name" class="form-input" placeholder="Christina Kaiser" type="text" />
          </div>
          <!-- User Input: Email (required) -->
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input id="email" name="email" class="form-input" placeholder="christina.kaiser@gelosmail.com.au"
              type="email" />
          </div>
          <!-- User Input: Phone Number (required) -->
          <div class="form-group">
            <label for="phone" class="form-label">Phone</label>
            <input id="phone" name="phone" class="form-input" placeholder="0414784975" type="text" />
          </div>
          <!-- User Input: Message (required) -->
          <div class="form-group">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-textarea" id="message" name="message" placeholder="Your message"></textarea>
          </div>
        </div>
        <!-- User Input: Submit Button -->
        <button id="btnSubmit" class="form-submit element" type="button">Submit</button>
      </form>
    </section>

  </main>

  <!-- Footer -->
  <footer id="pageFooter">
    <div class="footer-lines">
      <div class="line line-two"></div>
      <div class="line line-one"></div>
    </div>
    <!-- Footer Content -->
    <div class="footer-content">

      <!-- Copyright -->
      <p>&copy; 2026 Gelos Enterprises. All rights reserved.</p>

      <!--  -->
      <!-- TOGGLE BUTTON THAT TRIGGERS JAVASCRIPT -->
      <button class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle Dark Mode">
        <span id="modeSwitch">Switch to Dark Mode</span>
        <div class="switch-track">
          <div class="switch-thumb"></div>
        </div>
      </button>


      <!-- External Links -->
      <div class="external-links">
        <a class="external-link"
          href="https://share.tafensw.edu.au/share/file/5f1cec7b-1d03-446a-85b7-edb42692c34e/1/GE_Privacy-policy.pdf"
          target="_blank">Privacy Policy</a>
        <a class="external-link"
          href="https://share.tafensw.edu.au/share/file/5f1cec7b-1d03-446a-85b7-edb42692c34e/1/GE_Internet-usage-policy.pdf"
          target="_blank">Internet Usage Policy</a>
      </div>
    </div>
  </footer>

  <!-- Link to .js file -->
  <script src="js/script.js"></script>

</body>

</html>
