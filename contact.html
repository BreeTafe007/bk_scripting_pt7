<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Gelos Enterprises</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header>

    <nav>
      <div class="logo">
        <a href="index.html"><img id="header-logo" src="images/GE_Logo-inline-on-white.png"
            alt="Gelos Enterprises logo"></a>
      </div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="tasks.html">Tasks</a></li>
        <li><a class="active" href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="header-lines">
      <!-- <div class="line line-one"></div> -->
      <div class="line line-one"></div>
      <div class="line line-two"></div>
    </div>
  </header>

  <main class="contact-main">

    <!-- Contact form adapted from Web3Forms Basic HTML Contact Form template: https://web3forms.com/templates/basic-html-contact-form -->
    <section class="contact-section">
      <div class="contact-intro">
        <h2 class="contact-title">Contact Us</h2>
        <p class="contact-description">
          Fill out the form below and we will get back to you as soon as possible.
        </p>
      </div>

      <form class="contact-form" action="" method="POST">

        <div class="form-group-container">
          <div class="form-group">
            <label for="name" class="form-label">Name</label>
            <input id="name" name="name" class="form-input" placeholder="Kristina Kaiser" type="text" />
          </div>
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input id="email" name="email" class="form-input" placeholder="kristina.kaiser@gelos.org" type="email" />
          </div>
          <div class="form-group">
            <label for="phone" class="form-label">Phone</label>
            <input id="phone" name="phone" class="form-input" placeholder="+61 414784975" type="text" />
          </div>
          <div class="form-group">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-textarea" id="message" name="message" placeholder="Your message"></textarea>
          </div>
        </div>
        <button class="form-submit element" type="submit">Submit</button>
      </form>

    </section>

    <img id="contact-img" src="images/AdobeStock_443550502.jpeg"
      alt="Group of people having a meeting at an office table">

  </main>

  <footer>
    <div class="footer-lines">
      <div class="line line-two"></div>
      <div class="line line-one"></div>
    </div>
    <div class="footer-content">
      <p>&copy; 2026 Gelos Enterprises. All rights reserved.</p>
      <div class="external-links">
        <a class="external-link" href="GE_Privacy-policy.pdf" target="_blank">Privacy Policy</a>
        <a class="external-link" href="GE_Internet-usage-policy.pdf" target="_blank">Internet Usage Policy</a>
      </div>
    </div>
  </footer>

  <script src="js/script.js"></script>

</body>

</html>
